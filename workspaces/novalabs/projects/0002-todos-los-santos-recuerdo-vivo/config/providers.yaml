providers:
  video:
    primary:
      platform: Google AI Studio
      model: Veo 3.1 Quality
      max_duration: 8s
      aspect_ratios: [9:16]
      api_endpoint: google_flow_veo
    alternates:
      - platform: Google AI Studio
        model: Veo 3.1 Fast
        use_case: "borradores rápidos de animación"
      - platform: Google AI Studio
        model: Omni Flash
        use_case: "generación ultra-rápida"
  image:
    primary:
      platform: Google AI Studio
      model: Imagen 4
      api_endpoint: google_imagen
  audio:
    voiceover:
      platform: ElevenLabs
      model: Multilingual v2
      voice_id: "WarmEmpatheticSpanish"
    music:
      platform: Suno AI
      model: v4

preferences:
  default_duration: 6-8s
  default_aspect_ratio: "9:16"
  language_prompts: english
  language_content: spanish
