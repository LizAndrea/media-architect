providers:
  video:
    primary:
      platform: Google AI Studio
      model: Veo 3.1 Quality
      max_duration: 10s
      aspect_ratios: [9:16, 16:9, 1:1]
      api_endpoint: google_flow_veo
    alternates:
      - platform: Google AI Studio
        model: Veo 3.1 Fast
        use_case: "borradores rápidos y previas"
      - platform: Google AI Studio
        model: Omni Flash
        use_case: "generación ultra-rápida de prueba"
  image:
    primary:
      platform: Google AI Studio
      model: Imagen 4
      api_endpoint: google_imagen
  audio:
    voiceover:
      platform: ElevenLabs
      model: Multilingual v2
      voice_id: "mexican_male_professional_calm"
    music:
      platform: Suno AI
      model: v4
      style: "Corporate Ambient Synthwave, Downtempo Modern Piano, Elegant Rise"

preferences:
  default_duration: 7-8s
  default_aspect_ratio: 9:16
  language_prompts: english
  language_content: spanish
