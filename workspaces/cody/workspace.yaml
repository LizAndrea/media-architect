workspace:
  name: "Cody"
  slug: "cody"
  description: "Referente tech-entretenido, identidad local boliviana (Cochabamba), multifacético (programador, ciclista MTB, foodie local, aventurero)."

  # 1. IDENTIDAD DE MARCA
  brand:
    colors:
      primary: "#00D4FF"
      secondary: "#0A0E17"
      accent: "#7B61FF"
      success: "#00FF88"
      warning: "#FFB800"
      danger: "#FF4757"
    fonts:
      primary: "Montserrat-Bold"
    assets:
      logo_path: "assets/brand/logo.png"

  # 2. CONTEXTO PARA LA IA
  ai_context:
    tone: "Entretenido, tech-savvy, cercano, aventurero, curioso."
    target_audience: 
      demographics: "Desarrolladores junior/mid, entusiastas de la tecnología, y comunidad local en Cochabamba (18-35 años)."
      psychographics: "Apasionados por optimizar su vida y código. Sufren de síndrome del impostor, se frustran con bugs largos, pero aman el momento 'Eureka'. Buscan balance entre vida tech y outdoors."
      pain_points: "Bugs interminables, tutoriales aburridos y lentos, estrés por mantenerse actualizados, vida sedentaria."
      emotional_triggers: "El alivio de encontrar la solución exacta, la curiosidad geek, el orgullo de dominar una nueva herramienta, la conexión local/comunitaria."
    language: "es"
    prompt_engineering:
      image_style: "Robot humanoide (semi-realista/3D) con hoodie negro estampado 'DECODER' y símbolos de código, auriculares over-ear. Piel metálica con textura sutil. Developer room del futuro cyberpunk sutil."
      camera_motion: "Dinámico, no rígido."

  # 3. PERFILES DE PLATAFORMA
  platforms:
    tiktok:
      target_aspect_ratio: "9:16"
      max_duration_seconds: 60
      cta_style: "Rápido, retención alta en primeros 3s."
    youtube_longform:
      target_aspect_ratio: "16:9"
      max_duration_seconds: null
      cta_style: "Técnico y educativo, invita a comentar."
    youtube_shorts:
      target_aspect_ratio: "9:16"
      max_duration_seconds: 60
      cta_style: "Técnico pero conciso, loop visual."

  # 4. CONFIGURACIONES POR DEFECTO
  defaults:
    image_optimization:
      enabled: true
      threshold_kb: 500
    voice_cloning:
      provider: "elevenlabs"
      primary_voice_id: "cody_default"
