workspace:
  name: "NOVA HOME & TECH"
  slug: "nova"
  description: "Plataforma líder en importación directa de tecnología, comercialización de gadgets y productos digitales (IA, eBooks) usando neuromarketing viral."

  brand:
    colors:
      primary: "#06C4BF" # Cian NOVA (Tecnología, frescura)
      secondary: "#3A3939" # Gris Carbón (Elegancia, formalidad)
      accent: "#FFFFFF"
    fonts:
      primary: "Montserrat"
    assets:
      logo_path: "assets/brand/logo.png"

  ai_context:
    tone: "Disruptivo, tecnológico, hiper-dinámico, comercial pero con profunda resonancia psicológica y emocional (El 'rebuscador' inteligente)."
    target_audience: 
      demographics: "Jóvenes (18-35) y adultos (25-50) en Bolivia."
      psychographics: "Valoran la eficiencia, buscan el mejor trato (precio/calidad) y el estatus de tener lo último. Sienten estrés por la lentitud tecnológica o la rutina del hogar."
      pain_points: "Frustración con tecnología lenta, precios inflados por intermediarios, falta de tiempo, tareas domésticas pesadas."
      emotional_triggers: "Alivio inmediato, el sentimiento de 'ser más listo que el sistema' (comprador inteligente), curiosidad tecnológica y paz mental."
    language: "es"
    video_editing_style: "Hyper-fast pacing (cortes cada 1-2s), match cuts, whip pans, alto impacto visual publicitario, intercalados con pausas dramáticas de alivio."
    prompt_engineering:
      image_style: "Para Tuki: 3D Pixar style, volumetric lighting. Para productos: Ultra-realistic, cinematic High-End Commercial, Teal and Orange grading."
      camera_motion: "POV action shots, whip pans, smooth push-in for product reveals, slow-motion 60fps."
      character_consistency: "Exact same facial structure, exact same clothing for Tuki or human actors."

  platforms:
    tiktok_shorts:
      target_aspect_ratio: "9:16"
      max_duration_seconds: 60
      cta_style: "Gancho subliminal o CTA rápido al enlace en perfil (WhatsApp/Landing)."
    youtube_longform:
      target_aspect_ratio: "16:9"
      max_duration_seconds: null
      cta_style: "Profundo, muestra de valor y demostración extensa del gadget o software."
    facebook_ads:
      target_aspect_ratio: "4:5"
      max_duration_seconds: 45
      cta_style: "Urgencia, escasez ('Últimas unidades en stock directo de origen')."

  defaults:
    image_optimization:
      enabled: true
      threshold_kb: 500
    voice_cloning:
      provider: "elevenlabs"
      primary_voice_id: "nova_commercial_voice"
